version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shop-app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    networks:
      - shop-network

  nginx:
    image: nginx:latest
    container_name: shop-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - shop-network

  db:
    image: mysql:8.0
    container_name: shop-db
    restart: always
    environment:
      MYSQL_DATABASE: shop
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: shop_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    networks:
      - shop-network

networks:
  shop-network: